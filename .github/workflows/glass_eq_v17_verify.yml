name: Glass EQ Reference Verify

on:
  push:
    branches: [glass-eq-v1.7-reference-rebuild, glass-eq-v1.8-reference-lock, glass-eq-v1.9-reference-copy]
  workflow_dispatch:

concurrency:
  group: glass-eq-reference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  BUILD_DIR: BuildsGlassReferenceCI

jobs:
  macos-vst3:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DZL_JUCE_FORMATS="VST3" \
            -DZL_HWY_STATIC_TARGET="NEON" \
            .

      # Clean compile of the full v1.9 reference-copy rendering pass.
      - name: Build Glass EQ
        run: cmake --build "$BUILD_DIR" --config "$BUILD_TYPE"
